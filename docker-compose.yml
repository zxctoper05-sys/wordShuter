services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wordshooter
      POSTGRES_USER: wordshooter
      POSTGRES_PASSWORD: wordshooter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordshooter -d wordshooter"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wordshooter:wordshooter@db:5432/wordshooter
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - dictionaries:/app/data/raw   # скачанные словари переживают пересборку контейнера

volumes:
  pgdata:
  dictionaries:
